<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#2541F5" fill-opacity="0.10"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0B0B0F" flood-opacity="0.14"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B0B0F" flood-opacity="0.12"/>
    </filter>
    <clipPath id="screen"><rect x="1026" y="166" width="298" height="588" rx="36"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="#F5F7FB"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <circle cx="1480" cy="110" r="230" fill="#FFC914"/>
  <circle cx="110" cy="860" r="170" fill="none" stroke="#2541F5" stroke-opacity="0.12" stroke-width="40"/>

  <!-- store (destination) -->
  <g filter="url(#soft)">
    <rect x="150" y="170" width="200" height="150" rx="14" fill="#FFFFFF"/>
    <rect x="186" y="235" width="56" height="85" rx="6" fill="#DCE3FF"/>
    <rect x="262" y="235" width="62" height="46" rx="6" fill="#DCE3FF"/>
  </g>
  <g>
    <path d="M140 170 h220 l-12 -44 h-196 z" fill="#0B0B0F"/>
    <path d="M140 170 q18 26 36.7 0 q18 26 36.7 0 q18 26 36.7 0 q18 26 36.7 0 q18 26 36.7 0 q18 26 36.6 0 z" fill="#FFC914"/>
  </g>
  <!-- location pin -->
  <g transform="translate(250 60)">
    <path d="M0 0 c-26 0 -46 20 -46 45 c0 34 46 75 46 75 s46 -41 46 -75 c0 -25 -20 -45 -46 -45 z" fill="#2541F5"/>
    <circle cx="0" cy="45" r="16" fill="#FFFFFF"/>
  </g>
  <!-- route -->
  <path d="M360 250 C 470 250 520 300 560 372" fill="none" stroke="#2541F5" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 18"/>

  <!-- ground shadow -->
  <ellipse cx="520" cy="712" rx="410" ry="22" fill="#0B0B0F" fill-opacity="0.08"/>
  <!-- speed lines -->
  <g stroke="#0B0B0F" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round">
    <line x1="60" y1="470" x2="140" y2="470"/>
    <line x1="90" y1="530" x2="150" y2="530"/>
    <line x1="40" y1="590" x2="140" y2="590"/>
  </g>

  <!-- van -->
  <g filter="url(#shadow)">
    <rect x="170" y="372" width="490" height="290" rx="26" fill="#2541F5"/>
    <path d="M652 452 h96 q22 0 36 18 l64 88 q10 14 10 30 v58 q0 16 -16 16 h-190 z" fill="#2541F5"/>
  </g>
  <!-- cab window -->
  <path d="M676 476 h66 q12 0 19 10 l52 72 h-137 z" fill="#DCE3FF"/>
  <!-- yellow stripe -->
  <rect x="170" y="580" width="690" height="26" fill="#FFC914"/>
  <!-- door line + handle -->
  <line x1="660" y1="460" x2="660" y2="660" stroke="#1B30C9" stroke-width="4"/>
  <rect x="680" y="620" width="34" height="10" rx="5" fill="#1B30C9"/>
  <!-- headlight -->
  <rect x="846" y="618" width="16" height="26" rx="6" fill="#FFC914"/>
  <!-- logo on van -->
  <text x="214" y="488" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="84" letter-spacing="-3" fill="#FFFFFF">Zylo</text>
  <circle cx="388" cy="479" r="11" fill="#FFC914"/>
  <text x="218" y="536" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="22" fill="#FFFFFF" fill-opacity="0.85">Van Sales · Route 07</text>
  <!-- chassis + wheels -->
  <rect x="160" y="648" width="710" height="22" rx="11" fill="#0B0B0F"/>
  <g>
    <circle cx="300" cy="664" r="56" fill="#0B0B0F"/>
    <circle cx="300" cy="664" r="24" fill="#D7DCEA"/>
    <circle cx="300" cy="664" r="8" fill="#0B0B0F"/>
    <circle cx="742" cy="664" r="56" fill="#0B0B0F"/>
    <circle cx="742" cy="664" r="24" fill="#D7DCEA"/>
    <circle cx="742" cy="664" r="8" fill="#0B0B0F"/>
  </g>

  <!-- phone -->
  <g filter="url(#shadow)">
    <rect x="1010" y="150" width="330" height="620" rx="48" fill="#0B0B0F"/>
  </g>
  <rect x="1026" y="166" width="298" height="588" rx="36" fill="#FFFFFF"/>
  <g clip-path="url(#screen)">
    <rect x="1026" y="166" width="298" height="132" fill="#2541F5"/>
    <rect x="1135" y="176" width="80" height="18" rx="9" fill="#0B0B0F"/>
    <text x="1050" y="228" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" fill-opacity="0.8">Today's route</text>
    <text x="1050" y="258" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">Riffa · 14 stops</text>
    <rect x="1050" y="270" width="164" height="22" rx="11" fill="#FFC914"/>
    <circle cx="1064" cy="281" r="4" fill="#0B0B0F"/>
    <text x="1074" y="286" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#0B0B0F">Offline · 12 saved</text>

    <!-- invoice rows -->
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="1044" y="318" width="262" height="66" rx="16" fill="#F5F7FB"/>
      <circle cx="1078" cy="351" r="18" fill="#EEF1FF"/>
      <text x="1078" y="357" text-anchor="middle" font-weight="700" font-size="14" fill="#2541F5">AM</text>
      <text x="1106" y="346" font-weight="700" font-size="15" fill="#0B0B0F">Al Manar Market</text>
      <text x="1106" y="366" font-size="12" fill="#5A6275">INV-1042 · BHD 86.400</text>
      <circle cx="1284" cy="351" r="11" fill="#22C55E"/>
      <path d="M1278 351 l4 4 l8 -8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="1044" y="396" width="262" height="66" rx="16" fill="#F5F7FB"/>
      <circle cx="1078" cy="429" r="18" fill="#EEF1FF"/>
      <text x="1078" y="435" text-anchor="middle" font-weight="700" font-size="14" fill="#2541F5">GS</text>
      <text x="1106" y="424" font-weight="700" font-size="15" fill="#0B0B0F">Gulf Supermart</text>
      <text x="1106" y="444" font-size="12" fill="#5A6275">INV-1043 · BHD 142.750</text>
      <circle cx="1284" cy="429" r="11" fill="#22C55E"/>
      <path d="M1278 429 l4 4 l8 -8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="1044" y="474" width="262" height="66" rx="16" fill="#FFFFFF" stroke="#2541F5" stroke-width="2"/>
      <circle cx="1078" cy="507" r="18" fill="#2541F5"/>
      <text x="1078" y="513" text-anchor="middle" font-weight="700" font-size="14" fill="#FFFFFF">SC</text>
      <text x="1106" y="502" font-weight="700" font-size="15" fill="#0B0B0F">Seef Corner Store</text>
      <text x="1106" y="522" font-size="12" fill="#2541F5">Next stop · 1.2 km</text>

      <rect x="1044" y="552" width="262" height="66" rx="16" fill="#F5F7FB"/>
      <circle cx="1078" cy="585" r="18" fill="#EEF1FF"/>
      <text x="1078" y="591" text-anchor="middle" font-weight="700" font-size="14" fill="#2541F5">NB</text>
      <text x="1106" y="580" font-weight="700" font-size="15" fill="#0B0B0F">Noor Bakery</text>
      <text x="1106" y="600" font-size="12" fill="#5A6275">Scheduled · 11:30 AM</text>
    </g>

    <!-- button -->
    <rect x="1044" y="652" width="262" height="58" rx="29" fill="#FFC914"/>
    <text x="1175" y="688" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="18" fill="#0B0B0F">Print invoice</text>
  </g>

  <!-- floating chip: synced -->
  <g filter="url(#soft)">
    <rect x="800" y="206" width="246" height="80" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="842" cy="246" r="22" fill="#DCFCE7"/>
  <path d="M832 246 l7 7 l13 -14" fill="none" stroke="#16A34A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="876" y="242" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" fill="#0B0B0F">Synced to Odoo</text>
  <text x="876" y="266" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5A6275">14 invoices · just now</text>

  <!-- floating chip: works offline -->
  <g filter="url(#soft)">
    <rect x="1290" y="470" width="248" height="80" rx="22" fill="#0B0B0F"/>
  </g>
  <circle cx="1332" cy="510" r="22" fill="#FFC914"/>
  <g fill="none" stroke="#0B0B0F" stroke-width="3.5" stroke-linecap="round">
    <path d="M1318 506 q14 -12 28 0"/>
    <path d="M1324 512 q8 -6 16 0"/>
    <line x1="1320" y1="498" x2="1344" y2="522"/>
  </g>
  <circle cx="1332" cy="519" r="2.5" fill="#0B0B0F"/>
  <text x="1366" y="506" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" fill="#FFFFFF">Works offline</text>
  <text x="1366" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.7">Saves on the device</text>

  <!-- floating receipt -->
  <g filter="url(#soft)" transform="rotate(-6 930 560)">
    <path d="M880 470 h110 v150 l-11 -8 l-11 8 l-11 -8 l-11 8 l-11 -8 l-11 8 l-11 -8 l-11 8 l-11 -8 l-11 8 z" fill="#FFFFFF"/>
  </g>
  <g transform="rotate(-6 930 560)" font-family="Arial, Helvetica, sans-serif">
    <text x="896" y="498" font-weight="800" font-size="13" fill="#0B0B0F">TAX INVOICE</text>
    <rect x="896" y="510" width="78" height="6" rx="3" fill="#D7DCEA"/>
    <rect x="896" y="524" width="60" height="6" rx="3" fill="#D7DCEA"/>
    <rect x="896" y="538" width="70" height="6" rx="3" fill="#D7DCEA"/>
    <text x="896" y="576" font-weight="800" font-size="14" fill="#2541F5">BHD 86.400</text>
    <text x="896" y="594" font-size="11" fill="#5A6275">فاتورة ضريبية</text>
  </g>
</svg>
